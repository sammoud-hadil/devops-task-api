# Local Jenkins for the project.  Start with:  docker compose up -d --build
# Then open http://localhost:8080
services:
  jenkins:
    build: .
    container_name: jenkins
    user: root            # needed to use /var/run/docker.sock (local/school setup only)
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
